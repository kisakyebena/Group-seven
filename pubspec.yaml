name: uganda_prison_app
description: Mbarara Main Prison Visitors Information Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  slide_to_act: ^2.0.2
  flutter_animate: ^4.5.0
  animated_bottom_navigation_bar: ^1.3.3
  page_transition: ^2.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  table_calendar: ^3.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/animations/